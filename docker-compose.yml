# =============================================
# Docker Compose - AppAsistencia
# =============================================
# Servicios: Base de Datos PostgreSQL, Backend Django, Frontend Vite y Visor Adminer
# =============================================

services:
  # -----------------------------------------
  # Base de Datos PostgreSQL
  # -----------------------------------------
  db:
    image: postgres:16-alpine
    container_name: asistencia_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # Backend - Django
  # -----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asistencia_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations accounts attendance core &&
             python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"

  # -----------------------------------------
  # Frontend - Vite.js
  # -----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asistencia_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # -----------------------------------------
  # Visor Web de Base de Datos - Adminer
  # -----------------------------------------
  adminer:
    image: adminer:latest
    container_name: asistencia_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
